name: Job watcher
on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobs
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Restore state
        id: restore
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: ./state.sh restore jobs
      - name: Scan
        env:
          FLIP_TG_TOKEN: ${{ secrets.FLIP_TG_TOKEN }}
          FLIP_TG_CHAT: ${{ secrets.FLIP_TG_CHAT }}
        run: python3 jobs.py scan
      - name: Save state
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: mkdir -p state/jobs && ./state.sh save jobs
